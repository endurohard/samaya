name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Ночные E2E: раскомментировать
  # schedule:
  #   - cron: '0 3 * * *'

jobs:
  test:
    name: ${{ matrix.service }} — tsc + vitest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - user-service
          - salon-service
          - booking-service
          - client-service
          - inventory-service
          - finance-service
          - salary-service
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm test

  build:
    name: docker compose build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build all images
        env:
          # Заглушки только для интерполяции compose-файла при сборке
          JWT_SECRET: ci_dummy_secret_at_least_32_characters_long
          POSTGRES_USER: samaya
          POSTGRES_PASSWORD: ci_dummy
          POSTGRES_DB: samaya
        run: docker compose build

  # E2E (Playwright) — вручную или по ночному расписанию: требует полный стек.
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Start stack
        env:
          JWT_SECRET: ci_dummy_secret_at_least_32_characters_long
          POSTGRES_USER: samaya
          POSTGRES_PASSWORD: ci_dummy
          POSTGRES_DB: samaya
          FRONTEND_PORT: "3010"
        run: |
          cp .env.example .env
          echo "JWT_SECRET=$JWT_SECRET" >> .env
          echo "FRONTEND_PORT=3010" >> .env
          docker compose up -d --build
          # Ждём здоровья ключевых сервисов
          for i in $(seq 1 60); do
            healthy=$(docker compose ps --format '{{.Status}}' | grep -c healthy || true)
            [ "$healthy" -ge 8 ] && break
            sleep 5
          done
          docker compose ps
      - name: Create E2E test user
        run: |
          curl -sf -X POST http://localhost:3010/api/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"email":"playwright@samaya.test","password":"PlaywrightTest123!"}' || true
          # Роль owner для тестового пользователя (публичная регистрация даёт только client)
          docker compose exec -T postgres psql -U samaya -d samaya \
            -c "UPDATE users.users SET role = 'owner' WHERE email = 'playwright@samaya.test';"
      - name: Run Playwright
        working-directory: tests
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: tests/playwright-report/
